# arise-server Registry
# Updated: 2026-02-23
# Service registry for the arise-server container hosting platform
# Note: agent-server has its own repository

# ============================================================================
# SERVERS
# ============================================================================

servers:
  arise-server:
    description: Container hosting (DokPloy, n8n, demos)
    provider: Hetzner
    os: Ubuntu 24.04 LTS
    specs:
      cpu: TBD
      ram: TBD
    network:
      public_ip: TBD  # Update with actual IP
      tailscale_ip: TBD  # Update with Tailscale IP
      tailscale_hostname: arise-server
    ssh:
      command: ssh user@arise-server
      notes: Via Tailscale
    public_access: true
    public_domain: "*.arisegroup-tools.com"

  agent-server:
    description: AI agents (Claude Code, Ollama) - see separate repo
    tailscale_hostname: agent-server
    public_access: false

# ============================================================================
# NETWORKING
# ============================================================================

networking:
  tailscale:
    network_name: arise-tailnet
    purpose: Private inter-server communication and SSH access

  cloudflare:
    account_id: TBD  # Update with actual ID
    zones:
      arisegroup-tools.com:
        tunnel:
          id: "86c6d6ed-a7e0-48df-a50a-fc0766ff5ab6"
          name: arise-tunnel
        dns:
          wildcard: "*.arisegroup-tools.com"
          type: CNAME
          target: "86c6d6ed-a7e0-48df-a50a-fc0766ff5ab6.cfargotunnel.com"
      40hero.com:
        tunnel:
          id: "86c6d6ed-a7e0-48df-a50a-fc0766ff5ab6"
          name: arise-tunnel  # Same tunnel, different zone
        dns:
          records:
            - name: "acontext-api.40hero.com"
              type: CNAME
              target: "86c6d6ed-a7e0-48df-a50a-fc0766ff5ab6.cfargotunnel.com"
            - name: "acontext.40hero.com"
              type: CNAME
              target: "86c6d6ed-a7e0-48df-a50a-fc0766ff5ab6.cfargotunnel.com"
            - name: "wm.40hero.com"
              type: CNAME
              target: "86c6d6ed-a7e0-48df-a50a-fc0766ff5ab6.cfargotunnel.com"
            - name: "ops.40hero.com"
              type: CNAME
              target: "a5849419-711a-4925-b193-c5ec7bd59f76.cfargotunnel.com"  # agent-server-tunnel

  docker_networks:
    dokploy-network:
      type: external
      purpose: Traefik routing to public-facing containers
    internal:
      type: per-compose
      purpose: Isolated database/cache access

# ============================================================================
# SERVICES
# ============================================================================

services:
  # --- arise-server: Infrastructure ---
  dokploy:
    server: arise-server
    description: Container orchestration UI
    port: 3000
    url: https://dokploy.arisegroup-tools.com
    routing: direct-tunnel
    status: active

  traefik:
    server: arise-server
    description: Reverse proxy (managed by DokPloy)
    port: 80
    url: null  # Internal only
    routing: null
    status: active

  cloudflared:
    server: arise-server
    description: Cloudflare tunnel client
    port: null
    url: null
    routing: null
    status: active

  # --- arise-server: Production ---
  n8n-production:
    server: arise-server
    description: Main workflow automation
    port: 5678
    url: https://n8n.arisegroup-tools.com
    routing: direct-tunnel  # Legacy, bypasses Traefik
    stack:
      - PostgreSQL
      - Redis
      - Worker
    status: active

  # --- arise-server: Sandboxes ---
  tc-n8n:
    server: arise-server
    description: Trent's sandbox
    port: 5679
    url: https://tc-n8n.arisegroup-tools.com
    routing: direct-tunnel
    stack:
      - SQLite
    status: active

  ca-n8n:
    server: arise-server
    description: CA's sandbox
    port: TBD
    url: https://ca-n8n.arisegroup-tools.com
    routing: direct-tunnel
    stack:
      - SQLite
    status: active

  ma-n8n:
    server: arise-server
    description: MA's sandbox
    port: TBD
    url: https://ma-n8n.arisegroup-tools.com
    routing: direct-tunnel
    stack:
      - SQLite
    status: active

  mk-n8n:
    server: arise-server
    description: MK's sandbox
    port: TBD
    url: https://mk-n8n.arisegroup-tools.com
    routing: direct-tunnel
    stack:
      - SQLite
    status: active

  # --- arise-server: Client Dev Sandboxes ---
  plotter-n8n-dev:
    server: arise-server
    description: Plotter Mechanix development sandbox
    port: null  # Traefik routing, no host port needed
    url: https://plotter-n8n-dev.arisegroup-tools.com
    routing: traefik
    stack:
      - SQLite
    dokploy_id: 73K581yG6LR8gPxA5ZN9e
    status: active

  # --- arise-server: AContext (Context Data Platform) ---
  acontext-api:
    server: arise-server
    description: AContext REST API (Go)
    port: 8029  # Internal, Traefik-routed
    url: https://acontext-api.40hero.com
    routing: traefik
    stack:
      - PostgreSQL (pgvector)
      - Redis
      - RabbitMQ
      - MinIO (S3)
      - LiteLLM (Gemini proxy)
      - acontext-core (Python)
    dokploy_id: DBezrZjirLrWVDnb50t0z
    auth: "Bearer sk-ac-<ROOT_API_BEARER_TOKEN>"
    api_docs: https://acontext-api.40hero.com/swagger/index.html
    status: active

  acontext-ui:
    server: arise-server
    description: AContext Dashboard (Next.js)
    port: 3000  # Internal, Traefik-routed
    url: https://acontext.40hero.com
    routing: traefik
    dokploy_id: DBezrZjirLrWVDnb50t0z  # Same compose
    status: active

  # --- arise-server: Windmill (Workflow Engine) ---
  windmill:
    server: arise-server
    description: Workflow engine / internal tool builder (Arise)
    port: null  # Traefik routing, no host port needed
    url: https://windmill.arisegroup-tools.com
    routing: traefik
    stack:
      - PostgreSQL
      - Workers (default + native)
    dokploy_id: km2hC-IELWxzhXoKVEJW_
    status: active

  windmill-40hero:
    server: arise-server
    description: Workflow engine / internal tool builder (4.0 Hero)
    port: null  # Traefik routing, no host port needed
    url: https://wm.40hero.com
    routing: traefik
    stack:
      - PostgreSQL
      - Workers (default + native)
    dokploy_id: rftcK1q7c4J8iB5vIJzon
    status: active

  # --- agent-server: ops-mcp (routed via Cloudflare tunnel → Tailscale) ---
  ops-mcp:
    server: agent-server
    description: Operations MCP server (Claude Mobile bridge)
    port: 8000
    url: https://ops.40hero.com
    routing: direct-tunnel  # agent-server-tunnel (separate from arise-server tunnel)
    tunnel:
      id: "a5849419-711a-4925-b193-c5ec7bd59f76"
      name: agent-server-tunnel
    stack:
      - FastMCP (Python)
      - SQLite (ops.db)
      - Claude Code (subprocess, async queue)
    auth: OAuth 2.1 (GitHub proxy)
    status: active

  # --- agent-server: other services tracked in the agent-server repo ---

# ============================================================================
# PORT ASSIGNMENTS
# ============================================================================

port_assignments:
  arise-server:
    3000: dokploy
    80: traefik
    5678: n8n-production
    5679: tc-n8n
    # 5680: next available
    # Add new ports sequentially

# ============================================================================
# TUNNEL INGRESS ORDER
# ============================================================================
# IMPORTANT: Order matters! Specific routes before wildcard.

tunnel_ingress:
  - hostname: dokploy.arisegroup-tools.com
    service: http://localhost:3000
  - hostname: n8n.arisegroup-tools.com
    service: http://localhost:5678
  - hostname: tc-n8n.arisegroup-tools.com
    service: http://localhost:5679
  # Add new specific routes here...
  - hostname: acontext-api.40hero.com
    service: http://localhost:80  # Traefik routes to container
  - hostname: acontext.40hero.com
    service: http://localhost:80  # Traefik routes to container
  - hostname: wm.40hero.com
    service: http://localhost:80  # Traefik routes to container
  # ops.40hero.com is served by agent-server-tunnel (separate tunnel, not routed through arise-server)
  - hostname: "*.arisegroup-tools.com"
    service: http://localhost:80  # Traefik wildcard
  - service: http_status:404  # Catch-all
