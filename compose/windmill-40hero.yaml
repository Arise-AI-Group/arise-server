# Windmill - 4.0 Hero Instance
# Routing: Traefik → wm-40h-server (port 8000)
# Network: Dual-network pattern for isolation
#
# Services:
#   wm-40h-server        - API + frontend, port 8000
#   wm-40h-worker        - Job execution (default group)
#   wm-40h-worker-native - Lightweight/native jobs
#   wm-40h-db            - PostgreSQL 16

services:
  # === Windmill server (Traefik routes here) ===

  wm-40h-server:
    image: ghcr.io/windmill-labs/windmill:main
    restart: unless-stopped
    networks:
      - dokploy-network
      - internal
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@wm-40h-db/windmill?sslmode=disable
      - MODE=server
    depends_on:
      wm-40h-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # === Workers (internal only) ===

  wm-40h-worker:
    image: ghcr.io/windmill-labs/windmill:main
    restart: unless-stopped
    networks:
      - internal
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@wm-40h-db/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUP=default
    depends_on:
      wm-40h-db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker_cache:/tmp/windmill/cache

  wm-40h-worker-native:
    image: ghcr.io/windmill-labs/windmill:main
    restart: unless-stopped
    networks:
      - internal
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@wm-40h-db/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUP=native
      - NATIVE_MODE=true
      - NUM_WORKERS=4
      - SLEEP_QUEUE=200
    depends_on:
      wm-40h-db:
        condition: service_healthy

  # === Database (isolated) ===

  wm-40h-db:
    image: postgres:16
    restart: unless-stopped
    networks:
      - internal
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=windmill
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d windmill"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  dokploy-network:
    external: true
  internal:

volumes:
  db_data:
  worker_cache:

# Environment variables to set in DokPloy:
# POSTGRES_PASSWORD=<generate: openssl rand -hex 24>  (hex avoids URL-unsafe chars in DATABASE_URL)
#
# After deploying:
# 1. Add domain: wm.40hero.com (HTTPS: OFF, port: 8000, serviceName: wm-40h-server)
# 2. Redeploy to generate Traefik labels
# 3. Login: admin@windmill.dev / changeme (change immediately)
# 4. Set base URL in Instance Settings to https://wm.40hero.com
